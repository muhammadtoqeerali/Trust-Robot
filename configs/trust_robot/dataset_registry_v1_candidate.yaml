schema: trust_robot_dataset_registry
version: 1
status: candidate_not_frozen

principles:
  local_readiness_is_separate_from_proposal_status: true
  reference_streams_must_not_be_estimator_inputs: true
  score_only_reference_supported_dimensions: true
  reference_validity_is_dimension_specific: true
  raw_reference_files_are_immutable: true
  base_trajectory_derivatives_stay_in_one_split: true
  test_data_selects_no_parameters: true

physical_platform_plan:
  primary_eventual_physical_platform: local_quadruped_robot
  provisional_local_dataset_id: KIOS_QUADRUPED
  core_estimator_platform_specific: false
  core_modalities:
    - camera
    - lidar
    - imu
  optional_platform_modalities:
    - proprioception
  optional_future_platforms:
    - drone
  rules:
    - local_quadruped_development_data_must_be_explicitly_partitioned
    - local_quadruped_final_physical_test_trajectories_must_be_held_out
    - final_physical_test_data_selects_no_models_calibration_or_thresholds
    - proprioception_is_optional_until_actual_robot_streams_are_verified
    - drone_requirements_do_not_drive_the_current_core_architecture

