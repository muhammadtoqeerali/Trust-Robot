experiment:

  epochs: 100

  metrics:

    - accuracy
    - macro_f1
    - weighted_f1
    - latency
    - parameters


training:

  batch_size: 64

  optimizer: Adam

  learning_rate: 0.001

  seed: 42


augmentation:

  reliability_training: false

  corruption_probability: 0.3

  consistency_weight: 0.2
